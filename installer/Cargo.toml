[package]
name = "fable2-installer"
version = "0.1.0"
edition = "2021"
description = "Builds the Fable II (Xbox 360, 4D5307F1) PC recompilation from the player's own game files"
license = "Apache-2.0"
default-run = "fable2-installer"

[lib]
name = "fable2_installer"
path = "src/lib.rs"

# Command-line installer (maintainer tools, and what the setup program runs).
[[bin]]
name = "fable2-installer"
path = "src/main.rs"

# Fable II.exe: the launcher (native options dialog, then starts the game without a console).
[[bin]]
name = "fable2-launch"
path = "src/bin/fable2-launch.rs"

# Fable II Setup: the point-and-click installer (`fable2-installer package` appends the port).
[[bin]]
name = "fable2-setup"
path = "src/bin/fable2-setup.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

# Only the setup window (eframe) and the launcher dialog (windows-sys, Windows only) have dependencies. Everything that touches the game files (ISO reading,
# patching, hashing) is in this crate with no third-party code.
[dependencies]
eframe = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
